<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="608" viewBox="0 0 1000 608" role="img" aria-labelledby="speed-vs-evidence-title speed-vs-evidence-desc" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="speed-vs-evidence-title">Search speed vs. evidence coverage</title>
<desc id="speed-vs-evidence-desc">Exa: p50 4.456 seconds, p90 6.185 seconds, evidence@5 24/24, $0.008 metered per query; Parallel: p50 0.531 seconds, p90 0.624 seconds, evidence@5 24/24, $0.002 est per query; Tavily: p50 3.383 seconds, p90 5.476 seconds, evidence@5 22/24, $0.0177 est per query; Brave: p50 0.517 seconds, p90 0.559 seconds, evidence@5 21/24, $0.005 est per query; Firecrawl: p50 0.942 seconds, p90 1.763 seconds, evidence@5 16/24, $0.003 est per query</desc>
